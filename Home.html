<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: monospace;
        }

        .Navigation {
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;

        }

        .Navigation_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);
            transition: all 0.2s ease;
        }

        #Login_btn {
            display: flex;
            align-items: center;
            margin-left: auto;
            width: 180px;
            font-size: 20px;
            align-self: center;
            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }

        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-house-chimney {
            color: #1366b9;
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-list-check {
            color: rgb(95, 84, 255);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-envelope {
            color: rgb(103, 117, 78);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-user {
            color: rgb(235, 197, 154);
            font-size: 22px;
            margin-right: 8px;
        }

        .home_container {
            display: flex;
            flex-direction: row;
            gap: 60px;
            justify-content: center;
            background-image: url(./Home_background.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 89vh;
        }

        .Quote {
            padding-top: 5%;
            width: 33%;
        }

        .Quote>h1 {
            color: #2e2e2e;
            font-size: 35px;

        }

        .Quote>h2 {
            color: rgb(48, 48, 112);
        }

        .clock-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            font-size: 25px;
            color: #3f195f;
            font-weight: 600;
        }

        .clock-box i {
            color: #342264;
            font-size: 22px;
        }

        #Start_btn {
            background-color:rgb(194, 177, 152) ;
            padding: 15px;
            width: 200px;
            align-items: center;
            display: flex;
            justify-content: center;
            border-radius: 7px;
            font-size: 20px;
            text-decoration: none;
            color:black;
            
        }

        #Start_btn:hover {
            box-shadow: 0 0 8px;
            background-color: rgb(153, 138, 115);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-arrow-right-long {
            color: rgb(51, 51, 51);
            font-size: 22px;
            margin-left: 8px;
        }

        .home_img {
            padding-top: 120px;
        }

        .home_img>img {
            box-shadow: 0 0 5px;
            border-radius: 10px;
            padding-bottom: 20px;
            background-color: rgb(100, 133, 133, 0.5);
        }
    </style>
</head>

<body>
    <nav class="Navigation">
        <div class="Navigation_logo">
            <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 10H46C50 10 54 14 54 18V46C54 50 50 54 46 54H18C14 54 10 50 10 46V18C10 14 14 10 18 10Z"
                    fill="#5f62c2" />
                <path d="M18 32L28 42L46 22" stroke="white" stroke-width="6" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>

            <span>Taskora</span>
        </div>
        <a href="Home.html"><i class="fa-solid fa-house-chimney"></i>Home</a>
        <a href="Tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a href=""><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href=""><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Login.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>

    <div class="home_container">
        <div class="Quote">
            <h1>Capture, organize, and tackle your to-dos from anywhere.</h1>
            <h2>Escape the clutter and chaos—unleash your productivity.</h2>
            <a id="Start_btn" href="Signup.html">Start now <i class="fa-solid fa-arrow-right-long"></i></a>
            <div class="clock-box">
                <i class="fa-regular fa-clock"></i>
                <span id="clock"></span>
            </div>
        </div>
        
        <div class="home_img">
            <img src="./Home_img.avif" alt="Img Didn't load!">
        </div>
    </div>


    <script>
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.getElementById("clock").innerHTML = time;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>

</html>
