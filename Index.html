<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        font-family: monospace;
    }
    body {
        margin: 0px;
        padding: 0px;
    }

    .signup_login_header {
        flex-direction: row;
        display: flex;
        gap: 1%;
        padding: 12px;
        background-color: rgba(11, 33, 70, 0.75);
        justify-content: end;
    }

    .signup_login_header>a {
        text-decoration: none;
        color: #e5e7eb;
        font-size: 16px;
        text-decoration: underline;
    }

    .login {
        display: flex;
        height: 88vh;
        flex-direction: column;
        padding-top: 3%;
        align-items: center;
        background-image: url(./background.jpg);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
    }
    .login>h1{
        font-style: italic;
        font-size: 30px;
    }

    .background {
        background-color: rgba(44, 44, 44, 0.8);
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        padding: 40px;
        height: 55%;
        width: 50%;
        border-radius: 10px;
        gap: 20px;

    }

    .login_form {
        background-color: rgba(100, 91, 91, 0.8);
        border-radius: 10px;
        width: 500px;
        height: 305px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 10px;
        border: 1px solid black;
    }

    .login_form>h1{
        text-decoration: underline;
    }
    .login_form>input {
        padding: 12px;
        width: 80%;
        border-radius: 5px;
        border: 2px solid rgb(43, 43, 43);
        color: rgb(0, 0, 0);
        text-align: center;
        background-color: rgb(179, 179, 179);
    }

    .login_form>input:hover {
        width: 82%;
        box-shadow: 0 0 10px;
        transition: all 0.3s ease;
    }

    input::placeholder {
        color: rgb(14, 25, 48);
        font-size: 16px;
        font-family: monospace;
    }

    .login_form>a {
        text-decoration: none;
        font-size: 18px;
        color: white;
        text-decoration: underline;
    }

    .password_issue{
        flex-direction: row;
        display: flex;
        gap:100px;
    }
    .password_issue>label{
        font-size: 16px;
        color:white
    }

    .password_issue>a{
        text-decoration: none;
        text-decoration: underline;
        color:whitesmoke;
        font-size: 16px;
    }
    .submit_btn {
        background-color: rgb(0, 0, 0);
        color: white;
        padding: 10px;
        font-size: 16px;
        width: 85%;
        border-radius: 10px;
    }

    .submit_btn:hover {
        box-shadow: 0 0 5px;
        width: 87%;
        transition: all 0.3s ease;
    }
</style>

<body>
    <header class="signup_login_header">
        <a href="">Help</a>
        <a href="">Terms</a>
        <a href="">Privacy</a>
    </header>

    <div class="login">
        <h1>Organise Your Daily Tasks</h1>
        <div class="background">
            
            <form action="post" class="login_form">

                <h1>Login</h1>
                <input type="text" placeholder="Enter your username">
                <input type="text" placeholder="Create new password">
                <div class = "password_issue">
                    <label><input type="checkbox">Remember Me</label>
                    <a href="">Forget password?</a>
                </div>
                <button type="submit" class="submit_btn">Submit</button>
                <a href="./Signup.html">New User/Signup?</a>
            </form>
        </div>
    </div>

</body>

</html>
