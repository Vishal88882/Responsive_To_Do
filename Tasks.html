<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./Tasks.css">
</head>

<body>
    <nav class="Navigation">
        <div class="Navigation_logo">
            <span>Taskora</span>
        </div>
        <a href="Home.html"><i class="fa-solid fa-house-chimney"></i>Home</a>
        <a href="Tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a href="Contact.html"><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href="Account.html"><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Login.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>
    <div class="Task_Container">
        <div class="sidebar_container">
            <aside class="sidebar">
                <a href="Tasks.html"><i class="fa-solid fa-book"></i>Temporary Task!</a>
                <textarea id="messageBox" name="message" placeholder="..." autofocus></textarea>
                <a href="Calander.html"><i class="fa-solid fa-calendar-days"></i>Calander</a>
                <a href=""><i class="fa-solid fa-clipboard-check"></i>Completed Tasks</a>
                <a href=""><i class="fa-solid fa-hourglass-end"></i>Reamainig Tasks</a>
            </aside>
        </div>


        <div class="task_table">
            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Task</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="Task_Box">
                </tbody>
            </table>
        </div>
        <div class="Working_btns">
            <input type="text" placeholder="Task..." id="F1">
            <button type="button" id="_btn4">Add Task<i class="fa-regular fa-square-plus"></i></button>
            <input type="text" placeholder="Task ID..." id="F2">
            <button type="button" id="_btn5">Remove Task<i class="fa-solid fa-trash-can"></i></button>
        </div>
    </div>

    <script>
        const submit_btn4 = document.getElementById("_btn4")
        const Data_Of_Task = document.getElementById("Task_Box")
        const table = document.getElementById("Task_table")
        const remove_btn = document.getElementById("_btn5")

        submit_btn4.addEventListener('click', async(e) => {
            e.preventDefault();

            const userData = {
                task: document.querySelector('#F1').value
            };

            const Task = userData.task
            const email = localStorage.getItem("email")
            const password = localStorage.getItem("password")

            if (!email || !password) {
                return alert("Emial not found");
            }

            if (!userData.task) {
                return alert("Write Task first");
            }

            try {
                const response = await fetch('http://localhost:8000/addtask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        Task
                    })
                });
                const result = await response.json();

                if (!response.ok)
                    return alert("Invalid credentials!")
                alert('Task Added!');

                const ID = result[result.length - 1].ID;
                console.log(ID)
                console.log(result)
                Data_Of_Task.innerHTML += ` <tr>
                    <td>${ID}</td>
                    <td>${Task}</td>
                    <td>Pending</td>
                </tr>`
            } catch (error) {
                console.error('Fetch error:', error);
            }
        });

        window.addEventListener("DOMContentLoaded", fetchtasks);

        async function fetchtasks() {
            const email = localStorage.getItem("email");
            const password = localStorage.getItem("password");

            try {
                const response = await fetch("http://localhost:8000/taskinfo", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const result = await response.json();
                console.log(result);

                const tasks = result;
                console.log(result)

                Data_Of_Task.innerHTML = tasks.map(task => `
            <tr>
                <td>${task.ID}</td>
                <td>${task.Task}</td>
                <td>Pending</td>
            </tr>
        `).join("");

            } catch (err) {
                console.error(err);
            }
        }

        remove_btn.addEventListener('click', async(e) => {
            e.preventDefault()

            const userData = {
                taskId: document.querySelector('#F2').value
            };

            const Task_ID = userData.taskId
            const email = localStorage.getItem("email")
            const password = localStorage.getItem("password")

            if (!email || !password) {
                return alert("Email not found");
            }
            if (!userData.taskId) {
                return alert("Write Task first");
            }

            try {
                const response = await fetch('http://localhost:8000/removetask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        Task_ID
                    })
                });
                const result = await response.json();

                if (!response.ok)
                    return alert("Invalid credentials!")
                alert('Task Removed');
                fetchtasks()

            } catch (err) {
                console.error(err);
            }
        })
    </script>

</body>

</html>
