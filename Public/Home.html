    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: monospace;
            overflow-y: hidden;
            overflow-x: hidden;

        }

        .Navigation {
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;
        }

        .Navigation_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);
            transition: all 0.2s ease;
            text-decoration: underline;
        }

        #Login_btn {
            display: flex;
            align-items: center;
            margin-left: auto;
            width: 180px;
            font-size: 20px;
            align-self: center;
            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }

        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-house-chimney {
            color: #1366b9;
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-list-check {
            color: rgb(95, 84, 255);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-envelope {
            color: rgb(103, 117, 78);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-user {
            color: rgb(235, 197, 154);
            font-size: 22px;
            margin-right: 8px;
        }

        .home_container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            padding-top: 5%;
            padding-left: 4%;
            background-image: url(../Assets/Home_background.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 89vh;
        }

        .Quote>h1 {
            color: #2e2e2e;
            font-size: 35px;
        }

        .Quote>h2 {
            color: rgb(48, 48, 112);
        }

        #Start_btn {
            background-color: rgb(194, 177, 152);
            padding: 15px;
            width: 200px;
            align-items: center;
            display: flex;
            justify-content: center;
            border-radius: 7px;
            font-size: 20px;
            text-decoration: none;
            color: black;
        }

        #Start_btn:hover {
            box-shadow: 0 0 8px;
            background-color: rgb(153, 138, 115);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-arrow-right-long {
            color: rgb(51, 51, 51);
            font-size: 22px;
            margin-left: 8px;
        }

        .home_img {
            display: flex;
            padding-top: 90px;
            padding-right: 5%;
        }

        .home_img>img {
            box-shadow: 0 0 5px;
            border-radius: 10px;
            padding-bottom: 20px;
            background-color: rgb(100, 133, 133, 0.5);
            min-width: 250px;
            width: 640px;
            height: 350px;
