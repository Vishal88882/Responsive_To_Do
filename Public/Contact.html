    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: monospace;
        }
        
        .Navigation {
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;
        }

            color: #ff841f;
            font-size: 28px;

        }

            text-decoration: none;

            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }
        
        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);

        }
        
        #Login_btn {

            align-items: center;
            margin-left: auto;

            font-size: 20px;

            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }
        
        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);

        }

            flex-direction: row;
            justify-content: center;
            gap: 5%;

        .contact_qoute {
            width: 80%;
            margin-top: 2%;

            height: 65vh;
            display: flex;
            flex-direction: column;
            font-family: Arial;

            gap: 5%;

        }
        
        .contact_qoute_h1_h2 {
            background-color: rgba(55, 46, 94, 0.5);
            padding: 10px;
            border-radius: 7px;
            border: 2px;
        }
        
        .contact_img>img {
            margin-top: 40%;

            margin-left: 50%;
            padding: 15px;
            height: 40vh;
            background-color: rgba(131, 220, 231, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 10px;
        }
        
        .fa-regular {
            color: rgb(255, 230, 230);
            font-size: 38px;
            margin-right: 8px;
            margin-top: 2%;
        }
        
        .fa-phone {
            color: rgb(255, 230, 230);
            font-size: 35px;
            margin-right: 8px;
            margin-top: 3%;
        }
        
        .fa-instagram {
            color: rgb(255, 230, 230);
            font-size: 40px;
            margin-right: 8px;
            margin-top: 3%;
        }
        
        .fa-github {
            color: rgb(255, 230, 230);
            font-size: 40px;
            margin-right: 8px;
            margin-top: 3%;
        }
        
        .contact_Routes {
            background-color: rgba(9, 34, 17, 0.6);
            padding: 30px;
            border-radius: 10px;
            gap: 30px;
            display: flex;
            justify-content: center;
            width: 500px;
        }
        
        .contact_Routes>span {
            background-color: rgb(107, 148, 187, 0.7);
            padding: 10px;
            width: 150px;
            justify-content: center;
            align-items: center;
            display: flex;
            border-radius: 10px;
        }
        
        .contact_Routes>span:hover {
            transition: all 0.2s ease;
            background-color: rgba(127, 174, 219, 0.3);
        }
        
        .to_fill_space {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .to_fill_space>textarea {
            resize: none;
            width: 43.5%;
            border-radius: 10px;
            height: 100px;
            background-color: rgb(179, 179, 179);
            padding: 15px;
            border: 8px double rgb(5, 21, 39);
            font-size: 16px;
        }
        
        .to_fill_space>button {
            width: 250px;
            padding: 12px;
            font-size: 16px;
            border-radius: 7px;
            background-color: antiquewhite;
            color: black
        }
        
        .to_fill_space>button:hover {
            cursor: pointer;
            transition: all 0.3s ease;
            color: whitesmoke;
            background-color: black;
        }
