<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  

    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: monospace;
        }

        .Navigation {
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;

        }

        .Navigation_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);
            transition: all 0.2s ease;
        }

        #Login_btn {
            display: flex;
            align-items: center;
            margin-left: auto;
            width: 180px;
            font-size: 20px;
            align-self: center;
            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }

        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-house-chimney {
            color: #1366b9;
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-list-check {
            color: rgb(95, 84, 255);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-envelope {
            color: rgb(103, 117, 78);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-user {
            color: rgb(235, 197, 154);
            font-size: 22px;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <nav class="Navigation">
        <div class="Navigation_logo">
            <span>Taskora</span>
        </div>
        <a href="Home.html"><i class="fa-solid fa-house-chimney"></i>Home</a>
        <a href="Tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a href="Contact.html"><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href="Account.html"><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Login.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>


</body>
