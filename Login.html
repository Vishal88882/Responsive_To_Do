<body>
    <nav class="Navigation">

        <a href="Contact.html"><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href="Account.html"><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Login.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>

    <footer class="signup_login_footer">
        <a href="">Help</a>
        <a href="">Terms</a>
        <a href="">Privacy</a>
    </footer>


    <div class="login">
        <h1>Organise Your Daily Tasks</h1>
        <div class="background">

            <form action="post" class="login_form">

                <h1>Login</h1>
                <input type="text" placeholder="Enter your username" id="B1">
                <input type="text" placeholder="Enter your password" id="B2">
                <div class="password_issue">
                    <label><input type="checkbox">Remember Me</label>
                    <a href="Forget.html">Forget password?</a>
                </div>
                <button type="button" id="_btn1" class="submit_btn">Submit</button>
                <a href="Signup.html">New User/Signup?</a>
            </form>
        </div>
    </div>

    <script>

        const submit_btn1 = document.getElementById("_btn1")
        submit_btn1.addEventListener('click', async (e) => {
            e.preventDefault();

            const userData = {
                username: document.querySelector('#B1').value,
                password: document.querySelector('#B2').value
            };

            if (!userData.username || !userData.password) {
                return alert("Fill in all fields!");
            }

            try {
                const response = await fetch('http://localhost:8000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                if(!response.ok)
                    return alert("Invalid credentials!")
                    alert('Login successful!');
                    window.location.href = "Home.html";
              
            } catch (error) {
                console.error('Fetch error:', error);
            }
        });

    </script>
