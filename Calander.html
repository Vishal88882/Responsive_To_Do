<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Kablammo&family=Silkscreen:wght@400;700&family=Syne:wght@400..800&display=swap');

        * {
            font-family: "Black Ops One", Arial, Helvetica, sans-serif;
        }

        body {
            padding: 0px;
            margin: 0px;
            background-image: url(./94560fe3-0c9a-433d-a899-e67c257e2c6c.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

        }

        .Navigation {
            background-color: rgba(36, 36, 36, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;
            border-bottom-left-radius: 50px;
            border-top-right-radius: 50px;
            margin: 0.5%;
        }

        .Navigation_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);
            transition: all 0.3s ease;
            text-decoration: underline;
            text-decoration-color: white;
            text-decoration-thickness: 3px;
        }

        #Login_btn {
            display: flex;
            align-items: center;
            margin-left: auto;
            width: 180px;
            font-size: 20px;
            align-self: center;
            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }

        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-house-chimney {
            color: #1366b9;
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-list-check {
            color: rgb(95, 84, 255);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-envelope {
            color: rgb(103, 117, 78);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-user {
            color: rgb(235, 197, 154);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-arrow-right-long {
            color: rgb(51, 51, 51);
            font-size: 22px;
            margin-left: 4px;
        }

        /* Navigation responsive rules copied from Tasks.css */
        @media (max-width:1480px) {
            .Navigation {
                padding: 20px;
                gap: 40px;
                justify-content: space-between;
            }

            .Navigation_logo {
                gap: 15px;
                font-size: 20px;
                font-weight: 700;
            }

            .Navigation>a {
                font-size: 20px;
                padding: 2px;
            }

            #Login_btn {
                width: 120px;
                font-size: 20px;
                padding: 10px;
            }
        }

        @media (max-width:1280px) {
            .Navigation {
                padding: 15px;
                gap: 40px;
                justify-content: space-between;
            }

            .Navigation_logo {
                gap: 10px;
                font-size: 25px;
                font-weight: 700;
            }

            .Navigation>a {
                font-size: 20px;
                padding: 8px;
            }

            #Login_btn {
                width: 120px;
                font-size: 20px;
                padding: 15px;
            }
        }

        @media (max-width:1024px) {
            .Navigation {
                padding: 15px;
                gap: 22px;
                justify-content: space-between;
            }

            .Navigation_logo {
                gap: 5px;
                font-size: 22px;
            }

            .Navigation>a {
                font-size: 16px;
                padding: 6px;
            }

            #Login_btn {
                width: 120px;
                font-size: 16px;
                padding: 5px;
            }
        }

        .Task_Container {
            display: flex;
            background-image: url(./94560fe3-0c9a-433d-a899-e67c257e2c6c.jpg);
            justify-content: left;
            flex-direction: row;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 60vh;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
            padding: 16px;
        }

        .sidebar {
            width: auto;
            height: 84vh;
            background: linear-gradient(to top, rgba(28, 14, 53, 0.5), rgba(158, 131, 131, 0.5));
            border-right: 1px solid #000000;
            padding: 10px;
            display: flex;
            gap: 10px;
            margin-left: 0;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
            border-radius: 20px;
        }

        .sidebar>a {
            text-decoration: none;
            color: rgb(255, 255, 255);
            width: 95%;
            border-radius: 7px;
            background-color: rgb(0, 0, 0);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            height: 48px;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .sidebar>a i { margin-right: 8px; }

        .sidebar>a:hover {
            box-shadow: 0 0 10px;
            transition: all 0.2s ease;
            color: rgb(37, 37, 37);
            background-color: rgb(241, 219, 189);
        }

        label {
            text-align: center;
            justify-content: center;
            display: flex;
        }

        textarea {
            width: 85%;
            height: 250px;
            font-size: 16px;
            resize: none;
            border: 5px double;
            border-radius: 10px;
            background-color: rgb(1, 3, 11);
            color: whitesmoke;
        }

        .fa-book {
            color: rgb(226, 248, 184);
            font-size: 23px;
            margin-right: 8px;
        }

        .fa-calendar-days {
            color: rgb(226, 248, 184);
            font-size: 23px;
            margin-right: 8px;
        }

        .fa-clipboard-check {
            color: rgb(226, 248, 184);
            font-size: 25px;
            margin-right: 8px;
        }

        .fa-hourglass-end {
            color: rgb(226, 248, 184);
            font-size: 25px;
            margin-right: 8px;
        }

        .calendar {
            border: 5px double rgb(39, 39, 39);
            margin-top: 2%;
            border-radius: 10px;
            padding: 10px;
            flex: 1 1 600px;
            min-width: 280px;
            box-sizing: border-box;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar .embed-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: white;
            overflow: hidden;
            border-radius: 6px;
        }

        .calendar .embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .Under_construction {
            background-color: bisque;
            border-radius: 50px;
            font-size: 16px;
            color: rgb(82, 82, 82);
            box-shadow: 0 0 10px;
            padding: 30px;
            flex: 0 0 350px;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Responsive tweaks */
        @media (max-width: 900px) {
            .Task_Container {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .sidebar,
            .calendar,
            .Under_construction {
                flex: 1 1 100%;
                width: 100%;
                max-width: 100%;
                margin: 0 0 12px 0;
            }

            .calendar .embed-wrapper {
                aspect-ratio: 4/3;
            }
        }

        @media (max-width: 480px) {
            .Navigation>a {
                font-size: 16px;
                padding: 8px;
            }

            #Login_btn {
                width: auto;
                padding: 10px;
            }

            .calendar .embed-wrapper {
                aspect-ratio: 1/1;
            }
        }
    </style>
</head>

<body>
    <nav class="Navigation">
        <div class="Navigation_logo">
            <span>Taskora</span>
        </div>
        <a href="Home.html"><i class="fa-solid fa-house-chimney"></i>Home</a>
        <a href="Tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a href="Contact.html"><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href="Account.html"><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Login.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>
    <div class="Task_Container">
        <div class="sidebar_container">
            <aside class="sidebar">
                <a href="Tasks.html"><i class="fa-solid fa-book"></i>Temporary task!</a>
                <textarea name="Vishal" id="1234" placeholder="Notebook!"></textarea>
                <a href="Calander.html"><i class="fa-solid fa-calendar-days"></i></i>Calander</a>
                <a href=""><i class="fa-solid fa-clipboard-check"></i>Completed Tasks</a>
                <a href=""><i class="fa-solid fa-hourglass-end"></i>Reamainig Tasks</a>
            </aside>
        </div>
        <div class="calendar">
            <div class="embed-wrapper">
                <iframe
                    src="https://calendar.google.com/calendar/embed?ctz=Asia%2FKolkata&mode=WEEK&src=c3VuaGFyaWxhbHJhanB1ODg4MkBnbWFpbC5jb20"
                    loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
        <div class="Under_construction">
            <p>Lorem ipsum dolor sit amet, consectetur
                adipisicing elit. Eveniet, incidunt rerum cum iure adipisci
                atque ea odit ad asperiores itaque! </p>
        </div>
    </div>

</body>

</html>
