<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: monospace;
        }

        .Navigation {
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 15px;

        }

        .Navigation_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);
            transition: all 0.2s ease;
        }

        #Login_btn {
            display: flex;
            align-items: center;
            margin-left: auto;
            width: 180px;
            font-size: 20px;
            align-self: center;
            justify-content: center;
            padding: 15px;
            border-radius: 7px;
            background-color: rgb(190, 172, 143);
            text-decoration: none;
            color: black;
        }

        #Login_btn:hover {
            box-shadow: 0 0 10px;
            background-color: rgb(199, 179, 149);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fa-house-chimney {
            color: #1366b9;
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-list-check {
            color: rgb(95, 84, 255);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-envelope {
            color: rgb(103, 117, 78);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-user {
            color: rgb(235, 197, 154);
            font-size: 22px;
            margin-right: 8px;
        }

        .fa-arrow-right-long {
            color: rgb(51, 51, 51);
            font-size: 22px;
            margin-left: 8px;
        }

        .Task_Container {
            display: flex;
            background-image: url(./Home_background.jpg);
            justify-content: left;
            flex-direction: row;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 89vh;
            gap: 20px
        }

        .sidebar {
            width: 220px;
            height: 84vh;
            background-color: rgba(35, 56, 37, 0.5);
            border-right: 1px solid #ddd;
            padding: 18px;
            display: flex;
            gap: 20px;
            text-align: center;
            margin-left: auto;
            font-family: Arial;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar>a {
            text-decoration: none;
            color: rgb(29, 29, 29);
            padding: 20px;
            border-radius: 7px;
            background-color: rgb(230, 211, 180);
        }

        .sidebar>a:hover {
            box-shadow: 0 0 10px;
            transition: all 0.2s ease;
            background-color: rgb(241, 219, 189);
        }

        label {
            text-align: center;
            justify-content: center;
            display: flex;
        }

        textarea {
            width: 92%;
            height: 250px;
            font-size: 16px;
            resize: none;
            border: 5px double;
            border-radius: 10px;
        }

        .fa-book {
            color: rgb(226, 248, 184);
            font-size: 23px;
            margin-right: 8px;
        }

        .calendar {
            border: 2px solid black;
            border-radius: 10px;
            padding: 2px;
            height: 65.5vh
        }
    </style>
</head>

<body>
    <nav class="Navigation">
        <div class="Navigation_logo">
            <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 10H46C50 10 54 14 54 18V46C54 50 50 54 46 54H18C14 54 10 50 10 46V18C10 14 14 10 18 10Z"
                    fill="#5f62c2" />
                <path d="M18 32L28 42L46 22" stroke="white" stroke-width="6" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>

            <span>Taskora</span>
        </div>
        <a href="Home.html"><i class="fa-solid fa-house-chimney"></i>Home</a>
        <a href="Tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a href=""><i class="fa-solid fa-envelope"></i>Contact</a>
        <a href=""><i class="fa-solid fa-user"></i></i>Account</a>
        <a href="Index.html" id="Login_btn">Login<i class="fa-solid fa-arrow-right-long"></i></a>
    </nav>
    <div class="Task_Container">
        <div class="sidebar_container">
            <aside class="sidebar">
                <a href="Tasks.html" style="background-color: rgb(43, 43, 43); color:white"><i class="fa-solid fa-book"></i>Temperary task only!</a>
                <textarea name="Vishal" id="1234">NOTEBOOK!</textarea>
                <a href="Calander.html">Calander</a>
                <a href="">Completed Tasks</a>
                <a href="">Reamainig Tasks</a>
            </aside>
        </div>
        <div class="calendar">
            <iframe
                src="https://calendar.google.com/calendar/embed?ctz=Asia%2FKolkata&mode=WEEK&src=c3VuaGFyaWxhbHJhanB1ODg4MkBnbWFpbC5jb20"
                style="border:0" width="800" height="500">
            </iframe>
        </div>
    </div>

</body>

</html>
