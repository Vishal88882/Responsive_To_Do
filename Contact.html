            align-items: center;
            gap: 10px;
            color: #ff841f;
            font-size: 28px;
            font-weight: 700;
        }

        .Navigation>a {
            text-decoration: none;
            font-size: 22px;
            border-radius: 5px;
            padding: 10px;
            color: whitesmoke;
        }

        .Navigation>a:hover {
            box-shadow: 0 0 5px rgb(139, 138, 136);

        .contact_qoute_h1_h2 {
